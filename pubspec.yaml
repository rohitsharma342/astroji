name: astroji
description: A communication app for astrology consultations
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  get: ^4.6.6
  intl: ^0.18.1
  http: ^1.1.0
  shared_preferences: ^2.2.2
  shared_preferences_web: ^2.2.1
  cached_network_image: ^3.3.0
  flutter_rating_bar: ^4.0.1
  table_calendar: ^3.0.9
  flutter_chat_ui: ^1.6.8
  uuid: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true